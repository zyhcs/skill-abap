<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" style="background-color: #0a1628; font-family: 'Courier New', Courier, monospace;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#132a4a" stroke-width="0.8" />
    </pattern>

    <!-- Marker Arrowhead -->
    <marker id="arr-cyan-bp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00d2d3" />
    </marker>
    <marker id="arr-green-bp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10ac84" />
    </marker>
    <marker id="arr-red-bp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff6b6b" />
    </marker>
  </defs>

  <!-- Background Mesh Grid -->
  <rect x="0" y="0" width="960" height="760" fill="#0a1628" />
  <rect x="0" y="0" width="960" height="760" fill="url(#grid)" />

  <!-- Blueprint Outer Border -->
  <rect x="20" y="20" width="920" height="720" fill="none" stroke="#00d2d3" stroke-width="1.5" />
  <rect x="24" y="24" width="912" height="712" fill="none" stroke="#00d2d3" stroke-width="0.8" stroke-dasharray="6,3" />

  <!-- Title Block -->
  <text x="480" y="52" fill="#00d2d3" font-size="15" font-weight="bold" text-anchor="middle">ENGINEERING SPECIFICATION // WORKFLOW PIPELINE</text>
  <text x="480" y="70" fill="#54a0ff" font-size="11" text-anchor="middle">sap-ai-mcp-rest-api Full-Lifecycle Quality Gate &amp; Execution Pipeline</text>
  <line x1="40" y1="82" x2="920" y2="82" stroke="#00d2d3" stroke-width="1" />

  <!-- PIPELINE STEPS -->

  <!-- Step 1: User Request -->
  <g transform="translate(60, 105)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#00d2d3" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[01] USER REQUEST</text>
    <text x="120" y="38" fill="#00d2d3" font-size="9" text-anchor="middle">Prompt: Create Table ZTDEMO &amp; Report</text>
  </g>

  <!-- Step 2: Load SKILL & Rules -->
  <g transform="translate(360, 105)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#54a0ff" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[02] LOAD SKILL &amp; RULES</text>
    <text x="120" y="38" fill="#54a0ff" font-size="9" text-anchor="middle">Load SKILL.md + rules/ framework</text>
  </g>

  <!-- Step 3: Naming Check -->
  <g transform="translate(660, 105)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#54a0ff" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[03] CORPORATE RULES CHECK</text>
    <text x="120" y="38" fill="#54a0ff" font-size="9" text-anchor="middle">Table: ZT*, Domain: ZDO_*, Var: lv_*</text>
  </g>

  <!-- Step 4: Profile Guard Check (Diamond Decision) -->
  <g transform="translate(360, 195)">
    <polygon points="120,0 240,30 120,60 0,30" fill="#1d1e3a" stroke="#ff9f43" stroke-width="1.5" />
    <text x="120" y="26" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">[04] PROFILE GUARD CHECK</text>
    <text x="120" y="39" fill="#ff9f43" font-size="9" text-anchor="middle">sap_environments.json</text>
  </g>

  <!-- Step 5: Fail Block (QAS/PRD) -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="220" height="50" rx="4" fill="#2c1618" stroke="#ff6b6b" stroke-width="1.5" />
    <text x="110" y="22" fill="#ff6b6b" font-size="11" font-weight="bold" text-anchor="middle">⛔ REJECT WRITE ATTEMPT</text>
    <text x="110" y="38" fill="#ff6b6b" font-size="9" text-anchor="middle">ENVIRONMENT_WRITE_FORBIDDEN</text>
  </g>

  <!-- Step 6: Validate DDIC Names -->
  <g transform="translate(660, 200)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[05] VALIDATE DDIC NAMES</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /ddic/validate_names</text>
  </g>

  <!-- Step 7: Create DDIC -->
  <g transform="translate(660, 300)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[06] CREATE &amp; ACTIVATE DDIC</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /ddic/create (Domains+Table)</text>
  </g>

  <!-- Step 8: Verify DDIC Status -->
  <g transform="translate(360, 300)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[07] VERIFY STATUS ACTIVE</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /ddic/status (active = true)</text>
  </g>

  <!-- Step 9: Write ABAP Report -->
  <g transform="translate(60, 300)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[08] WRITE ABAP REPORT CODE</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">Header + UP TO 100 ROWS Limit</text>
  </g>

  <!-- Step 10: Syntax Check -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[09] ABAP SYNTAX CHECK</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /object/check</text>
  </g>

  <!-- Syntax Error Loop -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="240" height="45" rx="4" fill="#2c1618" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="120" y="20" fill="#ff6b6b" font-size="10" font-weight="bold" text-anchor="middle">AUTO FIX SYNTAX ERROR</text>
    <text x="120" y="34" fill="#ff6b6b" font-size="8" text-anchor="middle">Locate Error Line &amp; Fix Code</text>
  </g>

  <!-- Step 11: Save Source -->
  <g transform="translate(360, 420)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[10] SAVE SOURCE TO $TMP</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /object/save</text>
  </g>

  <!-- Step 12: Activate Report -->
  <g transform="translate(660, 420)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[11] COMPILE &amp; ACTIVATE</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /object/activate</text>
  </g>

  <!-- Step 13: Dynamic Probe Execution -->
  <g transform="translate(660, 540)">
    <rect x="0" y="0" width="240" height="50" rx="4" fill="#0e2439" stroke="#10ac84" stroke-width="1.5" />
    <text x="120" y="22" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[12] DYNAMIC EXECUTION</text>
    <text x="120" y="38" fill="#10ac84" font-size="9" text-anchor="middle">POST /run (Populate &amp; Query)</text>
  </g>

  <!-- Step 14: Finish -->
  <g transform="translate(360, 540)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#064e3b" stroke="#10ac84" stroke-width="2" />
    <text x="120" y="22" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">[13] TASK COMPLETE</text>
    <text x="120" y="38" fill="#a7f3d0" font-size="9" text-anchor="middle">Verified Results Returned</text>
  </g>

  <!-- CONNECTOR ARROWS -->
  <path d="M 300 130 L 360 130" fill="none" stroke="#00d2d3" stroke-width="2" marker-end="url(#arr-cyan-bp)" />
  <path d="M 600 130 L 660 130" fill="none" stroke="#00d2d3" stroke-width="2" marker-end="url(#arr-cyan-bp)" />
  <path d="M 780 155 L 780 180 L 480 180 L 480 195" fill="none" stroke="#ff9f43" stroke-width="2" marker-end="url(#arr-cyan-bp)" />
  
  <path d="M 360 225 L 280 225" fill="none" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arr-red-bp)" />
  <text x="315" y="218" fill="#ff6b6b" font-size="9" text-anchor="middle">QAS/PRD</text>

  <path d="M 600 225 L 660 225" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <text x="630" y="218" fill="#10ac84" font-size="9" text-anchor="middle">DEV OK</text>

  <path d="M 780 250 L 780 300" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 660 325 L 600 325" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 360 325 L 300 325" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 180 350 L 180 420" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 300 445 L 360 445" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 600 445 L 660 445" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 780 470 L 780 540" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />
  <path d="M 660 565 L 600 565" fill="none" stroke="#10ac84" stroke-width="2" marker-end="url(#arr-green-bp)" />

  <path d="M 180 470 L 180 520" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red-bp)" />
  <path d="M 60 542 L 30 542 L 30 445 L 60 445" fill="none" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red-bp)" />

  <!-- FOOTER & LEGEND -->
  <rect x="40" y="695" width="880" height="30" rx="4" fill="#0e2439" stroke="#00d2d3" stroke-width="1" />
  <text x="60" y="714" fill="#00d2d3" font-size="10">● Workflow Step</text>
  <text x="180" y="714" fill="#10ac84" font-size="10">● Validated Pass</text>
  <text x="300" y="714" fill="#ff6b6b" font-size="10">╌╌ Syntax Error Loop / Read-Only Guard</text>
  <text x="900" y="714" fill="#54a0ff" font-size="10" text-anchor="end">fireworks-tech-graph · Style 3 (Engineering Blueprint)</text>
</svg>